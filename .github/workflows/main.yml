name: Check and Build Kernel

# 环境变量：根据你的内核信息配置（无需修改）
env:
  kernel_repository: xiaomi-sdm660/android_kernel_xiaomi_sdm660
  kernel_branch: 11.0-eas
  device: sirius
  clang_version: r365631c
  defconfig: |
    jason_defconfig
  kernel_patch: |
  kernelsu_patch: |

# 触发方式：手动触发
on:
  workflow_dispatch:
    inputs:
      allow_rebuild:
        description: "Allow Rebuild (忽略KernelSU版本检查)"
        type: boolean
        default: false

jobs:
  # 步骤1：检查KernelSU是否有更新（避免重复编译）
  check_kernelsu_update:
    name: Check KernelSU Update
    runs-on: ubuntu-latest
    outputs:
      remote_version: ${{ steps.get_remote_version.outputs.version }}
      local_version: ${{ steps.get_local_version.outputs.version }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: this-repo
      
      - name: Get remote KernelSU version
        id: get_remote_version
        run: |
          remote_version=$(curl -s https://api.github.com/repos/tiann/KernelSU/releases/latest | jq -r '.tag_name')
          echo "version=$remote_version" >> $GITHUB_OUTPUT
      
      - name: Get local KernelSU version
        id: get_local_version
        run: |
          if [ -f "this-repo/last_kernelsu_version" ]; then
            local_version=$(cat this-repo/last_kernelsu_version)
          else
            local_version="0.0.0"
          fi
          echo "version=$local_version" >> $GITHUB_OUTPUT

  # 步骤2：编译内核（依赖步骤1的版本检查）
  build:
    name: Build Kernel for ${{ env.device }}
    needs: check_kernelsu_update
    if: inputs.allow_rebuild || needs.check_kernelsu_update.outputs.local_version != needs.check_kernelsu_update.outputs.remote_version
    runs-on: ubuntu-22.04  # 用22.04更稳定，适配工具链
    permissions:
      contents: write
    steps:
      - name: Set environment variables
        run: |
          echo "kernelsu_remote_version=${{ needs.check_kernelsu_update.outputs.remote_version }}" >> $GITHUB_ENV
          echo "timestamp=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

      - name: Install required packages
        run: |
          sudo apt update -y
          sudo apt install -y \
            binutils-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-aarch64-linux-gnu \
            g++-arm-linux-gnueabi \
            clang-${{ env.clang_version }} \
            curl jq git make bc bison flex libssl-dev

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.kernel_repository }}
          ref: ${{ env.kernel_branch }}
          path: kernel
          fetch-depth: 1

      - name: Checkout this repo (patches/configs)
        uses: actions/checkout@v4
        with:
          path: this-repo
          fetch-depth: 1

      - name: Merge defconfig (with validation)
        working-directory: kernel
        run: |
          # 清空目标defconfig，避免重复配置
          > arch/arm64/configs/merged_defconfig
          while read -r line; do
            if [ -z "$line" ] || [[ "$line" == "#"* ]]; then
              continue
            fi
            # 校验defconfig是否存在
            if [ ! -f "arch/arm64/configs/$line" ]; then
              echo "ERROR: Defconfig '$line' not found in arch/arm64/configs!"
              exit 1
            fi
            echo "Merging defconfig: $line"
            cat arch/arm64/configs/$line >> arch/arm64/configs/merged_defconfig
          done <<<"${{ env.defconfig }}"

      - name: Setup KernelSU
        working-directory: kernel
        run: |
          # 拉取KernelSU并集成
          curl -L https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s -- ${{ env.kernelsu_remote_version }}
          # 添加KernelSU必需配置 + 解决stune符号依赖
          echo 'CONFIG_KPROBES=y' >> arch/arm64/configs/merged_defconfig
          echo 'CONFIG_HAVE_KPROBES=y' >> arch/arm64/configs/merged_defconfig
          echo 'CONFIG_KPROBE_EVENTS=y' >> arch/arm64/configs/merged_defconfig
          echo 'CONFIG_KSU=y' >> arch/arm64/configs/merged_defconfig
          echo 'CONFIG_SCHED_STUNE=y' >> arch/arm64/configs/merged_defconfig

      - name: Apply kernel patches (with validation)
        working-directory: kernel
        run: |
          while read -r line; do
            if [ -z "$line" ] || [[ "$line" == "#"* ]]; then
              continue
            fi
            patch_path="../this-repo/patches/$line"
            # 校验patch文件是否存在
            if [ ! -f "$patch_path" ]; then
              echo "ERROR: Kernel patch '$patch_path' not found!"
              exit 1
            fi
            echo "Applying kernel patch: $line"
            git apply "$patch_path"
          done <<<"${{ env.kernel_patch }}"

      - name: Apply KernelSU patches (with validation)
        working-directory: kernel
        run: |
          while read -r line; do
            if [ -z "$line" ] || [[ "$line" == "#"* ]]; then
              continue
            fi
            patch_path="../this-repo/patches/$line"
            # 校验patch文件是否存在
            if [ ! -f "$patch_path" ]; then
              echo "ERROR: KernelSU patch '$patch_path' not found!"
              exit 1
            fi
            echo "Applying KernelSU patch: $line"
            git apply -p2 --directory KernelSU/kernel "$patch_path"
          done <<<"${{ env.kernelsu_patch }}"

      - name: Export compile flags (fix GCC/Clang compatibility)
        working-directory: kernel
        run: |
          echo flags="\
          O=out \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          KCFLAGS=\"-Wno-error -Wno-gcc-compat -Wno-parentheses-equality -Wno-constant-conversion -Wno-section -Wno-unneeded-internal-declaration\" \
          " | tee -a $GITHUB_ENV

      - name: Disable CONFIG_LTO_CLANG (避免编译失败)
        working-directory: kernel
        run: |
          echo 'CONFIG_LTO_CLANG=n' >> arch/arm64/configs/merged_defconfig

      - name: Make defconfig
        working-directory: kernel
        run: |
          make ${{ env.flags }} merged_defconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          make ${{ env.flags }} -j$(nproc --all)

      - name: Prepare flashable zip (AnyKernel3)
        run: |
          # 拉取AnyKernel3模板
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          # 复制编译好的镜像
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/
          # 配置AnyKernel3（根据你的设备修改，这里适配jason）
          sed -i "s/device.name1=/device.name1=${{ env.device }}/" anykernel/anykernel.sh
          sed -i "s/device.name2=/device.name2=jason/" anykernel/anykernel.sh
          # 打包
          cd anykernel
          zip -r ../kernel-${{ env.device }}-${{ env.timestamp }}.zip .

      - name: Upload compiled kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.device }}-${{ env.timestamp }}
          path: kernel-${{ env.device }}-${{ env.timestamp }}.zip

      - name: Update local KernelSU version
        working-directory: this-repo
        run: |
          echo ${{ env.kernelsu_remote_version }} > last_kernelsu_version
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add last_kernelsu_version
          git commit -m "Update KernelSU version to ${{ env.kernelsu_remote_version }}"
          git push
