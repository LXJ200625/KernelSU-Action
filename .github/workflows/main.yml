name: Build Kernel

env:
  kernel_repository: PocoF1-Resources/android_kernel_xiaomi_sdm845
  kernel_branch: 16.0-bpf
  device: dipper
  clang_version: r383902
  defconfig: |
    vendor/xiaomi/dipper.config
    vendor/xiaomi/mi845_defconfig
  kernel_patch: |

on:
  workflow_dispatch:

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set env
        run: |
          if [[ "$clang_version" = "r"* ]] || [[ "$clang_version" = "latest" ]]; then
              clang_type=aosp
          else
              clang_type=vanilla
          fi
          echo clang_type=$clang_type | tee -a $GITHUB_ENV

          if [[ "$clang_version" = "latest" ]]; then
              clang_version=$(curl -L https://android.googlesource.com/kernel/common/+/refs/heads/android-mainline/build.config.constants | grep -Eo 'r[0-9]{6}[a-z]?[0-9]?')
              echo clang_version=$clang_version | tee -a $GITHUB_ENV
          fi

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y \
              binutils-arm-linux-gnueabi \
              binutils-aarch64-linux-gnu

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.kernel_repository }}
          ref: ${{ env.kernel_branch }}
          submodules: recursive

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: this-repo
          submodules: recursive

      - name: Get latest kernel commit id
        run: |
          echo kernel_commit_id=$(git rev-parse HEAD) | tee -a $GITHUB_ENV
      
      - name: Fix BPF type mismatch
        run: |
          sed -i '1490s/fp->bpf_func = interpreters\[(round_up(stack_depth, 32) \/ 32) - 1\];/fp->bpf_func = (typeof(fp->bpf_func))interpreters[(round_up(stack_depth, 32) \/ 32) - 1];/' kernel/bpf/core.c
          
      - name: 【最终修复】智能替换高版本API并确保编译通过
        run: |
          set -e  # 遇到任何错误立即停止，便于排查

          # 1. 首先尝试使用补丁（容忍行号偏移）
          cat > /tmp/fix_bonding.patch << 'EOF'
          --- a/drivers/net/bonding/bond_main.c
          +++ b/drivers/net/bonding/bond_main.c
          @@ -2330,13 +2330,23 @@
                   return false;
           }
           
          +static bool bond_upper_dev_check(struct net_device *upper_dev, void *data)
          +{
          +       __be32 *ip_ptr = data;
          +       return (*ip_ptr == bond_confirm_addr(upper_dev, 0, *ip_ptr));
          +}
          +
           static bool bond_validate_src_mac(struct bonding *bond, __be32 ip)
           {
                  struct net_device *upper;
          -       netdev_for_each_all_upper_dev_rcu(bond->dev, upper, iter) {
          -               if (ip == bond_confirm_addr (upper, 0, ip)) {
          -                       return true;
          -               }
          -       }
          +       if (netdev_walk_all_upper_dev_rcu(bond->dev, bond_upper_dev_check, &ip))
          +               return true;
                  return false;
           }
          EOF

          echo "尝试应用补丁..."
          if patch -p1 -l -i /tmp/fix_bonding.patch; then
            echo "✅ 补丁应用成功。"
          else
            echo "⚠️ 补丁应用有偏移，尝试直接替换代码..."

            # 2. 补丁失败后的备用方案：直接搜索并替换代码块
            sed -i 's/netdev_for_each_all_upper_dev_rcu(bond->dev, upper, iter) {[^}]*}/if (netdev_walk_all_upper_dev_rcu(bond->dev, bond_upper_dev_check, \&ip)) return true;/' drivers/net/bonding/bond_main.c

            # 3. 确保回调函数存在（如果补丁没打上，手动插入）
            if ! grep -q "bond_upper_dev_check" drivers/net/bonding/bond_main.c; then
              sed -i '/static bool bond_validate_src_mac(struct bonding \*bond, __be32 ip)/i\
static bool bond_upper_dev_check(struct net_device *upper_dev, void *data)\
{\
\    __be32 *ip_ptr = data;\
\    return (*ip_ptr == bond_confirm_addr(upper_dev, 0, *ip_ptr));\
\}\
' drivers/net/bonding/bond_main.c
            fi
          fi

          # 4. 最终验证：确保错误代码已被移除
          if grep -n "netdev_for_each_all_upper_dev_rcu" drivers/net/bonding/bond_main.c; then
            echo "❌ 修复失败，错误代码仍然存在。"
            exit 1  # 主动报错停止流程，避免继续编译
          else
            echo "✅ 已验证：高版本API调用已被移除。"
          fi

          # 5. 双重保险：确保配置已禁用（即使代码修复，配置也保持一致）
          echo "CONFIG_BONDING=n" >> arch/arm64/configs/merged_defconfig
          echo "✅ 已禁用 bonding 驱动配置。"

       
      - name: Merge defconfig
        run: |
          while read -r line; do
              if [ -z "$line" ] || [[ "$line" == "#"* ]]; then
                  continue
              fi
              echo "Merging defconfig: $line"
              cat arch/arm64/configs/$line >>arch/arm64/configs/merged_defconfig
          done <<<"$defconfig"

      - name: Apply kernel patch
        run: |
          while read -r line; do
              if [ -z "$line" ] || [[ "$line" == "#"* ]]; then
                  continue
              fi
              echo "Applying kernel patch: $line"
              git apply "this-repo/patches/$line"
          done <<<"$kernel_patch"

      - name: "AOSP-Clang: Restore"
        id: aosp_clang_restore
        if: env.clang_type == 'aosp'
        uses: actions/cache/restore@v4
        with:
          path: aosp-clang
          key: aosp-clang-${{ env.clang_version }}

      - name: "AOSP-Clang: Download"
        id: aosp_clang_download
        if: env.clang_type == 'aosp' && steps.aosp_clang_restore.outputs.cache-hit != 'true'
        run: |
          aosp_clang_branch=$(
              case "$clang_version" in
              r365631c ) echo android11-release;;
              r383902 | r416183b) echo master-kernel-build-2021 ;;
              r450784e) echo master-kernel-build-2022 ;;
              r487747c) echo main-kernel-build-2023 ;;
              *) echo main ;;
              esac
          )
          mkdir -p aosp-clang
          curl -L https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/$aosp_clang_branch/clang-$clang_version.tar.gz | tar xz -C aosp-clang

      - name: "AOSP-Clang: Save"
        id: aosp_clang_save
        if: env.clang_type == 'aosp' && steps.aosp_clang_download.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: aosp-clang
          key: aosp-clang-${{ env.clang_version }}

      - name: "AOSP-Clang: Setup"
        if: env.clang_type == 'aosp'
        run: |
          echo PATH=$(pwd)/aosp-clang/bin:$PATH | tee -a $GITHUB_ENV

      - name: "Vanilla-Clang: Setup"
        if: env.clang_type == 'vanilla'
        run: |
          curl -L https://apt.llvm.org/llvm.sh | sudo bash -s -- $clang_version
          echo PATH=/usr/lib/llvm-$clang_version/bin:$PATH | tee -a $GITHUB_ENV

      - name: export flags
        run: |
          echo flags=" \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          " | tee -a $GITHUB_ENV

      - name: Make defconfig
        run: |
          make $flags merged_defconfig

      - name: Make
        run: |
          make $flags -j$(nproc --all)

      - name: AnyKernel3
        run: |
          curl -Lo AnyKernel3.zip https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip
          unzip AnyKernel3.zip

          cat >AnyKernel3-master/anykernel.sh <<EOF
          properties() { '
          kernel.string=$kernel_repository $kernel_branch for $device
          do.devicecheck=1
          do.modules=0
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=$device
          '; }

          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto

          . tools/ak3-core.sh
          split_boot
          flash_boot
          EOF

          cp out/arch/arm64/boot/Image.gz AnyKernel3-master/
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
              cp out/arch/arm64/boot/dtbo.img AnyKernel3-master/
          fi

          cd AnyKernel3-master
          rm -rf .git* README.md
          zip -r ../boot.zip *

      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: boot
          path: boot.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-$(date +%Y%m%d-%H%M%S)
          body: |
            Device: ${{ env.device }}
            Kernel: https://github.com/${{ env.kernel_repository }}/tree/${{ env.kernel_commit_id }}
            Branch: ${{ env.kernel_branch }}
          files: boot.zip
