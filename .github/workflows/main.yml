name: Check and Build with ReSukiSU
env:
  kernel_repository: LXJ200625/sdm660-jason
  kernel_branch: main-15
  device: jason
  clang_version: r487747c
  defconfig: |
    jason_defconfig
  kernel_patch: |

on:
  workflow_dispatch:
    inputs:
      allow_rebuild:
        description: "Allow Rebuild"
        type: boolean
        default: false

jobs:
  check_resukisu_update:
    name: Check ReSukiSU update
    runs-on: ubuntu-latest
    steps:
      - name: Check ReSukiSU version
        id: check_resukisu_version
        run: |
          local_version=$(curl -L --header 'authorization: Bearer ${{ github.token }}' https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name || echo "v0.0.0")
          remote_version=$(curl -L https://api.github.com/repos/ReSukiSU/ReSukiSU/releases/latest | jq -r .tag_name)
          echo "local_version=$local_version" >> $GITHUB_OUTPUT
          echo "remote_version=$remote_version" >> $GITHUB_OUTPUT
    outputs:
      local_version: ${{ steps.check_resukisu_version.outputs.local_version }}
      remote_version: ${{ steps.check_resukisu_version.outputs.remote_version }}

  build:
    name: Build kernel
    needs: check_resukisu_update
    if: inputs.allow_rebuild || needs.check_resukisu_update.outputs.local_version != needs.check_resukisu_update.outputs.remote_version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set environment variables
        run: |
          echo "resukisu_remote_version=${{ needs.check_resukisu_update.outputs.remote_version }}" >> $GITHUB_ENV
          if [[ "$clang_version" = "r"* ]] || [[ "$clang_version" = "latest" ]]; then
              echo "clang_type=aosp" >> $GITHUB_ENV
          else
              echo "clang_type=vanilla" >> $GITHUB_ENV
          fi
          if [[ "$clang_version" = "latest" ]]; then
              clang_version=$(curl -L https://android.googlesource.com/kernel/common/+/refs/heads/android-mainline/build.config.constants | grep -Eo 'r[0-9]{6}[a-z]?[0-9]?')
              echo "clang_version=$clang_version" >> $GITHUB_ENV
          fi

      - name: Install build dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
              binutils-arm-linux-gnueabi \
              binutils-aarch64-linux-gnu \
              flex \
              bison \
              libssl-dev \
              bc \
              gcc \
              g++ \
              git \
              wget \
              curl \
              jq

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.kernel_repository }}
          ref: ${{ env.kernel_branch }}
          submodules: recursive

      - name: Checkout this workflow repo
        uses: actions/checkout@v4
        with:
          path: this-repo
          submodules: recursive

      - name: Get kernel commit ID
        run: |
          echo "kernel_commit_id=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Merge defconfig
        run: |
          > arch/arm64/configs/merged_defconfig
          while read -r line; do
            if [ -z "$line" ] || [[ "$line" == "#"* ]]; then
              continue
            fi
            echo "Merging defconfig: $line"
            cat "arch/arm64/configs/$line" >> "arch/arm64/configs/merged_defconfig"
          done <<< "$defconfig"

      - name: Setup ReSukiSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup-old-kernels.sh" | bash -s -- $resukisu_remote_version
          sed -i 's/seccomp_types.h/seccomp.h/' drivers/kernelsu/Kbuild
          echo 'CONFIG_KSU=y' >> arch/arm64/configs/merged_defconfig
          echo 'CONFIG_KPROBES=y' >> arch/arm64/configs/merged_defconfig
          echo 'CONFIG_HAVE_KPROBES=y' >> arch/arm64/configs/merged_defconfig
          echo 'CONFIG_KPROBE_EVENTS=y' >> arch/arm64/configs/merged_defconfig
          echo 'CONFIG_KALLSYMS=y' >> arch/arm64/configs/merged_defconfig
          echo 'CONFIG_KALLSYMS_ALL=y' >> arch/arm64/configs/merged_defconfig
          echo 'CONFIG_DEBUG_INFO=y' >> arch/arm64/configs/merged_defconfig
          echo '# CONFIG_DEBUG_INFO_BTF is not set' >> arch/arm64/configs/merged_defconfig

      - name: Restore AOSP-Clang from cache
        id: aosp_clang_restore
        if: env.clang_type == 'aosp'
        uses: actions/cache/restore@v4
        with:
          path: aosp-clang
          key: aosp-clang-${{ env.clang_version }}

      - name: Download AOSP-Clang
        id: aosp_clang_download
        if: env.clang_type == 'aosp' && steps.aosp_clang_restore.outputs.cache-hit != 'true'
        run: |
          aosp_clang_branch=$(
            case "$clang_version" in
              r365631c) echo "android11-release" ;;
              r383902 | r416183b) echo "master-kernel-build-2021" ;;
              r450784e) echo "master-kernel-build-2022" ;;
              r487747c) echo "main-kernel-build-2023" ;;
              *) echo "main" ;;
            esac
          )
          mkdir -p aosp-clang
          curl -L "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/$aosp_clang_branch/clang-$clang_version.tar.gz" | tar xz -C aosp-clang

      - name: Save AOSP-Clang to cache
        if: env.clang_type == 'aosp' && steps.aosp_clang_download.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: aosp-clang
          key: aosp-clang-${{ env.clang_version }}

      - name: Set up AOSP-Clang
        if: env.clang_type == 'aosp'
        run: |
          echo "PATH=$(pwd)/aosp-clang/bin:$PATH" >> $GITHUB_ENV

      - name: Set up Vanilla-Clang
        if: env.clang_type == 'vanilla'
        run: |
          curl -L https://apt.llvm.org/llvm.sh | sudo bash -s -- $clang_version
          echo "PATH=/usr/lib/llvm-$clang_version/bin:$PATH" >> $GITHUB_ENV

      - name: Set build flags
        run: |
          echo "flags= \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

      - name: Generate defconfig
        run: |
          make $flags merged_defconfig

      - name: Build kernel
        run: |
          make $flags -j$(nproc --all) 2>&1 | tee build.log

      - name: Prepare AnyKernel3
        run: |
          curl -Lo AnyKernel3.zip https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip
          unzip -q AnyKernel3.zip
          cat > AnyKernel3-master/anykernel.sh <<EOF
properties() {
kernel.string=$kernel_repository $kernel_branch with ReSukiSU $resukisu_remote_version for $device
do.devicecheck=1
do.modules=0
do.cleanup=1
do.cleanuponabort=1
device.name1=$device
}
block=auto
is_slot_device=auto
ramdisk_compression=auto
patch_vbmeta_flag=auto
. tools/ak3-core.sh
split_boot
flash_boot
EOF
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3-master/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3-master/
          cd AnyKernel3-master
          rm -rf .git* README.md
          zip -rq ../boot.zip *

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot
          path: boot.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.resukisu_remote_version }}
          body: |
            Device: ${{ env.device }}
            Kernel: https://github.com/${{ env.kernel_repository }}/tree/${{ env.kernel_commit_id }}
            Branch: ${{ env.kernel_branch }}
            ReSukiSU: https://github.com/ReSukiSU/ReSukiSU/releases/tag/${{ env.resukisu_remote_version }}
          files: boot.zip
          draft: false
          prerelease: false
